<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sorteio </title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="painel">
        <h1> Sorteio de nomes </h1>
        <p class="subtitulo"> Dois jogadores serão escolhidos para o cpnfronto! </p>
     <div class="batalha">
            <div class="jogador jogador1">
            <div class="icone"> x </div>
            <h2> Jogador1 </h2>
            <div class="nome" id="jogador1"> Aguardando... </div>
         </div>

        <div class="versus"> VS </div>

        <div class="jogador jogador2">
            <div class="icone"> 0 </div>
            <h2> Jogador2 </h2>
            <div class="nome" id="jogador2"> Aguardando... </div>
            </div>
        </div>

        <div class="acoes">
            <button class="sortear" onclick="sortear()"> Sortear </button>
            <button class="sortear" onclick="voltar()"> Voltar </button>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
